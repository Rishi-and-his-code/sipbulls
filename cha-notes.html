<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHA Study Notes | SIPBULLS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">SB</span><span class="brand-name">SIPBULLS<small>CHA Study Notes</small></span></a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="cha.html" class="active">All Notes</a>
      <a href="cha-bank.html">Question Bank</a>
      <button class="btn btn-ghost" id="lang-toggle" style="padding:4px 10px;font-size:12px;color:white;border-color:rgba(255,255,255,0.3)">हिंदी</button>
      <a class="cta" href="cha-exam.html?new=1">Mock Test</a>
    </nav>
  </header>

  <main class="wrap notes-reader">
    <div class="notes-reader-top">
      <a class="btn btn-ghost" href="cha.html">← Back to all modules</a>
      <button class="btn btn-gold" id="print-btn">Print / Save PDF</button>
    </div>
    <div id="notes-content" class="notes-content"><p class="loading">Loading full study guide…</p></div>
  </main>

  <footer class="site-footer"><div class="wrap"><div><h3>SIPBULLS</h3><p>Customs Broker License Examination preparation suite.</p></div><div><h3>Founder</h3><p>Yagnesh Kachhadia</p></div><div><h3>Contact</h3><p><a href="mailto:yagnesh2879@gmail.com">yagnesh2879@gmail.com</a></p></div><div class="footer-note">A SIPBULLS product. Unofficial exam preparation resource.</div></div></footer>

  <script type="module">
    const moduleId = new URLSearchParams(location.search).get('id');
    let lang = localStorage.getItem('cha-language') || 'hi';
    let modules = [];
    const content = document.getElementById('notes-content');
    const langButton = document.getElementById('lang-toggle');

    function render() {
      const item = modules.find(module => module.id === moduleId) || modules[0];
      if (!item) { content.innerHTML = '<p class="empty">Study guide not found.</p>'; return; }
      const isHindi = lang === 'hi';
      document.title = `${isHindi ? item.titleHi : item.title} | SIPBULLS`;
      langButton.textContent = isHindi ? 'English' : 'हिंदी';
      content.innerHTML = `
        <div class="notes-kicker">SIPBULLS · CHA / CBLR CONCEPTUAL LEARNING</div>
        <h1>${isHindi ? item.titleHi : item.title}</h1>
        <p class="notes-summary">${isHindi ? item.summaryHi : item.summary}</p>
        <div class="notes-divider"></div>
        <h2>${isHindi ? 'मुख्य वैधानिक बिंदु' : 'Key statutory points'}</h2>
        <ul class="notes-points">${(isHindi ? item.keyPointsHi : item.keyPoints).map(point => `<li>${point}</li>`).join('')}</ul>
        <div class="notes-divider"></div>
        <article class="notes-article">${isHindi ? item.detailedNotesHi : item.detailedNotes}</article>
        <div class="notes-end"><strong>${isHindi ? 'अगला कदम:' : 'Next step:'}</strong> ${isHindi ? 'इस अध्याय के बाद संबंधित प्रश्न बैंक का अभ्यास करें और मॉक टेस्ट में अपनी तैयारी जांचें।' : 'After studying this chapter, practise the related question bank and test your readiness with a mock test.'}</div>
      `;
    }

    langButton.addEventListener('click', () => { lang = lang === 'en' ? 'hi' : 'en'; localStorage.setItem('cha-language', lang); render(); });
    document.getElementById('print-btn').addEventListener('click', () => window.print());
    fetch('data/cha_concepts.json').then(response => response.json()).then(data => { modules = data; render(); }).catch(() => { content.innerHTML = '<p class="empty">Unable to load the study guide. Please refresh the page.</p>'; });
  </script>
</body>
</html>
